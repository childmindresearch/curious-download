[project]
name = "curious-download"
version = "0.2.0"
description = "Download and decrypt Curious (MindLogger) answer data into an admin-compatible responses.csv, and download data dictionaries"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "fastapi>=0.110",
    "httpx>=0.27",
    "questionary>=2.0",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.29",
]

[project.scripts]
curious-download = "curious_download.cli:main"
curious-participant-counts = "curious_download.participant_counts:main"
curious-app = "curious_download.webapp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
# The dashboard reasons in participants' local time with naive datetimes on purpose.
"tests/test_schedule.py" = ["DTZ"]
"tests/test_dashboard.py" = ["DTZ"]
"tests/fake_dashboard.py" = ["DTZ"]

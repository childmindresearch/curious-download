[project]
name = "curious-download"
version = "0.1.0"
description = "Download and decrypt Curious (MindLogger) answer data into an admin-compatible responses.csv"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42",
    "httpx>=0.27",
    "questionary>=2.0",
    "rich>=13",
    "typer>=0.12",
]

[project.scripts]
curious-download = "curious_download.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
